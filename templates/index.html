<!DOCTYPE html>
<html>
<head>
    <title>AR College Navigation</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
    <div id="ui-container">
        <h1>AR College Navigation</h1>
        <div class="location-selectors">
            <div class="selector">
                <label for="start">Start Location:</label>
                <select id="start"></select>
            </div>
            <div class="selector">
                <label for="end">Destination:</label>
                <select id="end"></select>
            </div>
            <button id="start-button">Start Navigation</button>
            <button id="ar-button" style="display: none;">Start AR</button>
        </div>
        <div id="distance-info" style="display: none;">
            Distance to destination: <span id="distance-value">0</span> meters
        </div>
        <div id="compatibility-message" style="display: none;">
            <h2>AR Requirements</h2>
            <ul>
                <li>Browser: Chrome on Android</li>
                <li>Device: Android phone with ARCore support</li>
                <li>Permissions: Camera and location access required</li>
            </ul>
        </div>
    </div>

    <!-- A-Frame Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-camera rotation-reader></a-camera>
        <div id="ar-entities"></div>
    </a-scene>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
